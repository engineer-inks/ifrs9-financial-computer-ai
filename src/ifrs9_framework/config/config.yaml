algorithm: ebm
auto_tune: true
categorical_features:
- uf
- codigo_contrato
- tipo_produto
- data_contratacao
- data_vencimento
- data_evento
group_column: codigo_contrato
hyperparameters:
  interactions:
  - 0
  - 10
  learning_rate:
  - 0.001
  - 0.3
  max_bins:
  - 64
  - 512
  scale_pos_weight:
  - 1
  - 50
loss_function: logloss
numeric_features:
- cliente_id
- idade
- renda
- zona_risco_flag
- bureau_score
- obito_flag
- prazo_meses
- limite_credito
- valor_financiado
- selic_contratacao
- churn_flag
pipeline_name: ifrs9_credit_origination
target_column: default_flag
yeo_johnson_features: []
